services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_catalog
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d recipe_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/zglossip/recipe-catalog-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=recipe_catalog;Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  scanner:
    image: ghcr.io/zglossip/recipe-catalog-scanner:latest
    restart: unless-stopped
    environment:
      RECIPE_CATALOG_API_BASE_URL: http://api:8080
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data: